name: Feature request
description: Propose a focused improvement to Skill Eval
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the developer problem before proposing an implementation. Requests are evaluated against project direction, trust boundaries, and maintenance cost.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete skill-development or evaluation problem cannot be handled well today?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should become observably better for the developer?
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example workflow
      description: Show a realistic target skill, prompt, development state, or evaluation where this matters.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Current alternatives
      description: What have you tried, and why is it insufficient?

  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Describe the smallest coherent capability and any explicit non-goals.

  - type: textarea
    id: evidence
    attributes:
      label: Success and regression evidence
      description: How could the improvement be measured, and what existing behavior must remain unchanged?

  - type: checkboxes
    id: expectations
    attributes:
      label: Expectations
      options:
        - label: I understand that requests may be declined when they do not fit the project's direction or maintenance model.
          required: true
